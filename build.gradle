apply plugin: 'java'
apply plugin: 'application'

mainClassName = 'escapeShip.Main'

// tag::repositories[]
repositories { 
    mavenCentral() 
}
// end::repositories[]

// tag::jar[]
jar {
    baseName = 'gs-gradle'
    version =  '0.1.0'
}
// end::jar[]

// tag::dependencies[]
sourceCompatibility = 1.8
targetCompatibility = 1.8

dependencies {
    compile "joda-time:joda-time:2.2"
    testCompile "junit:junit:4.12"
}
// end::dependencies[]

// tag::wrapper[]
// end::wrapper[]
task checkCoreDecoupled {
    description = 'Verifies that reusable game logic stays free of AWT/Swing dependencies.'
    group = 'verification'

    doLast {
        def forbiddenImports = ['import java.awt', 'import javax.swing']
        def checkedFiles = fileTree('src/main/java/escapeShip/core') {
            include '**/*.java'
        }.files as Set
        checkedFiles.addAll([
            file('src/main/java/escapeShip/GameLoop.java'),
            file('src/main/java/escapeShip/EscapeShip.java'),
            file('src/main/java/escapeShip/Asteroid.java'),
            file('src/main/java/escapeShip/Laser.java'),
            file('src/main/java/escapeShip/GamePolygon.java'),
            file('src/main/java/escapeShip/Collider.java')
        ])

        checkedFiles.each { sourceFile ->
            def source = sourceFile.text
            forbiddenImports.each { forbiddenImport ->
                if (source.contains(forbiddenImport)) {
                    throw new GradleException("${sourceFile} must not contain ${forbiddenImport}")
                }
            }
        }
    }
}

check.dependsOn checkCoreDecoupled
