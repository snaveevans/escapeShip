plugins {
    id 'java'
    id 'application'
}

application {
    mainClass = 'escapeShip.Main'
}

// tag::repositories[]
repositories {
    mavenCentral()
}
// end::repositories[]

// tag::jar[]
jar {
    archiveBaseName = 'escape-ship'
    archiveVersion = '0.1.0'
}
// end::jar[]

tasks.register('webDist', Copy) {
    description = 'Copies browser-playable web assets into build/web.'
    group = 'distribution'
    from 'src/main/resources/web'
    into layout.buildDirectory.dir('web')
}

// tag::dependencies[]
java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

dependencies {
    testImplementation "junit:junit:4.12"
}
// end::dependencies[]

// tag::wrapper[]
// end::wrapper[]
